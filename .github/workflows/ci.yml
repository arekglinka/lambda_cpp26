name: Release Build

on:
  push:
    branches: [release]
    tags: ['v*']
    paths:
      - src/**
      - handler.py
      - conanfile.py
      - profiles/**
      - recipes/**
      - Containerfile
      - Containerfile.base
      - .github/workflows/ci.yml
      - .github/workflows/base-image.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lambda_cpp26

jobs:
  base:
    uses: ./.github/workflows/base-image.yml

  build-test-publish:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build + test (fast — base cached)
        run: |
          podman build \
            --build-arg BASE_TAG=${{ needs.base.outputs.conan_tag }} \
            --build-arg REGISTRY_OWNER=${{ github.repository_owner }} \
            --target test \
            -t lambda-cpp26:test \
            -t ${{ env.IMAGE }}:${{ steps.version.outputs.version }} \
            -t ${{ env.IMAGE }}:latest \
            -f Containerfile .

      - name: Extract .so + size check
        run: |
          podman run --rm --entrypoint sh lambda-cpp26:test \
            -c 'cat /var/task/sum_columns.so' > sum_columns.so
          SIZE=$(stat -c%s sum_columns.so)
          echo "Extension size: $SIZE bytes ($((SIZE / 1048576)) MB)"
          if [ "$SIZE" -gt 83886080 ]; then
            echo "FAIL: .so exceeds 80 MB budget"
            exit 1
          fi

      - name: Push image to ghcr.io
        run: |
          podman push ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          podman push ${{ env.IMAGE }}:latest

      - name: Create GitHub Release with .so asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            sum_columns.so \
            --title "${{ github.ref_name }}" \
            --notes "Lambda C++26 extension — Arrow C++ 18 + QuantLib 1.38

          Size: $(stat -c%s sum_columns.so) bytes ($(($(stat -c%s sum_columns.so) / 1048576)) MB)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
