name: DevContainer Image

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - recipes/**
      - profiles/**
      - src/**
      - conanfile.py
      - Containerfile.gcc-base
      - Containerfile.deps
      - .github/workflows/devcontainer.yml
  workflow_dispatch:
  schedule:
    # Weekly rebuild. Intermediate images are content-hash cached, so this
    # only does work if the ECR base image or our Dockerfiles changed.
    - cron: '0 3 * * 0'

permissions:
  contents: read
  packages: write

env:
  OWNER: ${{ github.repository_owner }}

# =============================================================================
# Three serial jobs, two of them cacheable:
#
#   gcc-base ──► deps ──► assemble-devcontainer
#   (cached)    (cached)  (always rebuilds, ~5 min)
#
# Cold cache:  ~80 min  (gcc 25 + deps 50 + assemble 5)
# Warm cache:  ~5 min   (just assemble)
# Recipe change: ~55 min (deps rebuilds + assemble; gcc stays cached)
#
# Why serial (not parallel arrow + quantlib): Conan's consumer-side options
# (arrow csv/json overrides, boost version pin via override=True) only apply
# when installing from the project's conanfile.py. Splitting the dep graph
# via `conan install --requires=arrow/18.0.0` produces a different binary
# variant that triggers a full rebuild at consume time — defeating the
# parallelism. See docs/architecture.md "DevContainer Image Publishing".
# =============================================================================

jobs:

  gcc-base:
    name: GCC base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
      cache_hit: ${{ steps.check.outputs.cache_hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Hash inputs (this Dockerfile only)
        id: hash
        run: |
          HASH=$(sha256sum Containerfile.gcc-base | awk '{print substr($1,1,16)}')
          echo "tag=$HASH" >> "$GITHUB_OUTPUT"
          echo "GCC base tag: $HASH"

      - name: Check cache hit
        id: check
        run: |
          if podman pull ghcr.io/${OWNER}/lambda_cpp26-gcc-base:${{ steps.hash.outputs.tag }}; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache hit — skipping GCC rebuild"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
            echo "Cache miss — will rebuild GCC (~25 min)"
          fi

      - name: Build + push GCC base
        if: steps.check.outputs.cache_hit != 'true'
        run: |
          podman build -f Containerfile.gcc-base \
            -t ghcr.io/${OWNER}/lambda_cpp26-gcc-base:${{ steps.hash.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-gcc-base:latest \
            .
          podman push ghcr.io/${OWNER}/lambda_cpp26-gcc-base:${{ steps.hash.outputs.tag }}
          podman push ghcr.io/${OWNER}/lambda_cpp26-gcc-base:latest
          echo "::notice::Built gcc-base ${{ steps.hash.outputs.tag }}"

  deps:
    name: Conan deps (arrow + quantlib + transitives)
    needs: gcc-base
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
      cache_hit: ${{ steps.check.outputs.cache_hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        # ubuntu-latest runners ship ~14 GB free but a fresh `conan install`
        # for arrow+boost+quantlib needs ~10 GB (boost source alone is ~5 GB
        # of HTML docs that we don't read but get extracted anyway). Clear
        # preinstalled toolchains we don't use to recover ~6 GB.
        run: |
          sudo rm -rf /usr/share/dotnet                       \
                      /usr/local/lib/android                  \
                      /opt/ghc                                \
                      /opt/hostedtoolcache/CodeQL             \
                      /usr/local/.ghcup                       \
                      /usr/local/share/boost                  \
                      /opt/swift                              \
                      /usr/local/julia*                       \
                      /usr/lib/firefox                        \
                      /opt/microsoft/powershell               \
                      /usr/share/swift                        2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Hash inputs (recipes + profile + root conanfile + gcc-base tag)
        id: hash
        run: |
          CONTENT_HASH=$(cat recipes/arrow/conanfile.py     recipes/arrow/conandata.yml \
                              recipes/quantlib/conanfile.py recipes/quantlib/conandata.yml \
                              profiles/al2023               conanfile.py \
                        | sha256sum | awk '{print substr($1,1,16)}')
          HASH="${CONTENT_HASH}-${{ needs.gcc-base.outputs.tag }}"
          echo "tag=$HASH" >> "$GITHUB_OUTPUT"
          echo "Deps tag: $HASH"

      - name: Check cache hit
        id: check
        run: |
          if podman pull ghcr.io/${OWNER}/lambda_cpp26-deps:${{ steps.hash.outputs.tag }}; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache hit — skipping Conan deps rebuild"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
            echo "Cache miss — will build arrow + quantlib (~50 min)"
          fi

      - name: Build + push deps image
        if: steps.check.outputs.cache_hit != 'true'
        run: |
          podman build -f Containerfile.deps \
            --build-arg REGISTRY_OWNER=${OWNER} \
            --build-arg GCC_TAG=${{ needs.gcc-base.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-deps:${{ steps.hash.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-deps:latest \
            .
          podman push ghcr.io/${OWNER}/lambda_cpp26-deps:${{ steps.hash.outputs.tag }}
          podman push ghcr.io/${OWNER}/lambda_cpp26-deps:latest
          echo "::notice::Built deps ${{ steps.hash.outputs.tag }}"

  assemble-devcontainer:
    name: Assemble devcontainer
    needs: [gcc-base, deps]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build assembled devcontainer
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DATE_TAG="dev-$(date -u +%Y%m%d)"

          podman build -f .devcontainer/Dockerfile \
            --build-arg REGISTRY_OWNER=${OWNER} \
            --build-arg DEPS_TAG=${{ needs.deps.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-dev:${SHORT_SHA} \
            -t ghcr.io/${OWNER}/lambda_cpp26-dev:latest \
            -t ghcr.io/${OWNER}/lambda_cpp26-dev:${DATE_TAG} \
            .

      - name: Push all tags
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DATE_TAG="dev-$(date -u +%Y%m%d)"
          podman push ghcr.io/${OWNER}/lambda_cpp26-dev:${SHORT_SHA}
          podman push ghcr.io/${OWNER}/lambda_cpp26-dev:latest
          podman push ghcr.io/${OWNER}/lambda_cpp26-dev:${DATE_TAG}

      - name: Summary
        if: always()
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DATE_TAG="dev-$(date -u +%Y%m%d)"
          {
            echo "### DevContainer image published"
            echo ""
            echo "Build inputs:"
            echo "| Stage | Tag | Status |"
            echo "|---|---|---|"
            echo "| gcc-base | \`${{ needs.gcc-base.outputs.tag }}\` | ${{ needs.gcc-base.outputs.cache_hit == 'true' && '✓ cache hit' || '🔄 rebuilt' }} |"
            echo "| deps | \`${{ needs.deps.outputs.tag }}\` | ${{ needs.deps.outputs.cache_hit == 'true' && '✓ cache hit' || '🔄 rebuilt' }} |"
            echo ""
            echo "Published tags:"
            echo '```'
            echo "ghcr.io/${OWNER}/lambda_cpp26-dev:${SHORT_SHA}"
            echo "ghcr.io/${OWNER}/lambda_cpp26-dev:latest"
            echo "ghcr.io/${OWNER}/lambda_cpp26-dev:${DATE_TAG}"
            echo '```'
            echo ""
            echo "Teammates: \`git pull\` then Reopen in Container — VSCode pulls :latest automatically."
          } >> "$GITHUB_STEP_SUMMARY"
