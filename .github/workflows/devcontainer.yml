name: DevContainer Image

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - recipes/**
      - profiles/**
      - src/**
      - conanfile.py
      - small-deps-conanfile.py
      - arrow-conanfile.py
      - quantlib-conanfile.py
      - Containerfile.gcc-base
      - Containerfile.small-deps
      - Containerfile.arrow
      - Containerfile.quantlib
      - .github/workflows/devcontainer.yml
  workflow_dispatch:
  schedule:
    # Weekly rebuild. Intermediate images are content-hash cached, so this
    # only does work if the ECR base image or our Dockerfiles changed.
    - cron: '0 3 * * 0'

permissions:
  contents: read
  packages: write

env:
  OWNER: ${{ github.repository_owner }}

# =============================================================================
# Five jobs, four of them cacheable:
#
#   gcc-base ──► small-deps ──► arrow ──┐
#                            ──►        ├──► assemble-devcontainer
#                            ──► quantlib ──┘
#                            (parallel)
#
# Cold cache:    ~60 min  (gcc 1 + small-deps 20 + parallel[arrow 30 ‖ quantlib 30] + assemble 5)
# Warm cache:    ~5 min   (just assemble)
# Recipe change: only the affected stage rebuilds + assemble (~5 min assemble + one stage)
#
# Why this works (when previous parallel attempts failed):
# 1. arrow and quantlib images both FROM small-deps (common ancestor). Their
#    conan caches share IDENTICAL transitives. cp -rn merge in assemble is
#    conflict-free — only the deltas (arrow/quantlib binaries) get copied.
# 2. Per-library conanfiles (arrow-conanfile.py, quantlib-conanfile.py) apply
#    the project's consumer options (csv/json=False for arrow, etc.) so each
#    parallel job produces the same binary variant the project's conanfile.py
#    would. Previous attempts used --requires=arrow/18.0.0 which skipped
#    consumer options and produced a wrong variant.
# =============================================================================

jobs:

  gcc-base:
    name: GCC base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
      cache_hit: ${{ steps.check.outputs.cache_hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Hash inputs (this Dockerfile only)
        id: hash
        run: |
          HASH=$(sha256sum Containerfile.gcc-base | awk '{print substr($1,1,16)}')
          echo "tag=$HASH" >> "$GITHUB_OUTPUT"
          echo "GCC base tag: $HASH"

      - name: Check cache hit
        id: check
        run: |
          if podman pull ghcr.io/${OWNER}/lambda_cpp26-gcc-base:${{ steps.hash.outputs.tag }}; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache hit — skipping GCC rebuild"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
            echo "Cache miss — will rebuild GCC (~25 min)"
          fi

      - name: Build + push GCC base
        if: steps.check.outputs.cache_hit != 'true'
        run: |
          podman build -f Containerfile.gcc-base \
            -t ghcr.io/${OWNER}/lambda_cpp26-gcc-base:${{ steps.hash.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-gcc-base:latest \
            .
          podman push ghcr.io/${OWNER}/lambda_cpp26-gcc-base:${{ steps.hash.outputs.tag }}
          podman push ghcr.io/${OWNER}/lambda_cpp26-gcc-base:latest
          echo "::notice::Built gcc-base ${{ steps.hash.outputs.tag }}"

  small-deps:
    name: Small deps (transitives only)
    needs: gcc-base
    runs-on: ubuntu-latest
    # Cold build: ~20 min (boost source extract + thrift + openssl + abseil).
    # 30 min leaves margin.
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
      cache_hit: ${{ steps.check.outputs.cache_hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        # ubuntu-latest runners ship ~14 GB free; boost source alone is ~5 GB.
        # Clear preinstalled toolchains we don't use to recover ~6 GB.
        run: |
          sudo rm -rf /usr/share/dotnet                       \
                      /usr/local/lib/android                  \
                      /opt/ghc                                \
                      /opt/hostedtoolcache/CodeQL             \
                      /usr/local/.ghcup                       \
                      /usr/local/share/boost                  \
                      /opt/swift                              \
                      /usr/local/julia*                       \
                      /usr/lib/firefox                        \
                      /opt/microsoft/powershell               \
                      /usr/share/swift                        2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Hash inputs (small-deps-conanfile.py + profile + gcc-base tag)
        id: hash
        run: |
          CONTENT_HASH=$(cat small-deps-conanfile.py profiles/al2023 | sha256sum | awk '{print substr($1,1,16)}')
          HASH="${CONTENT_HASH}-${{ needs.gcc-base.outputs.tag }}"
          echo "tag=$HASH" >> "$GITHUB_OUTPUT"
          echo "Small deps tag: $HASH"

      - name: Check cache hit
        id: check
        run: |
          if podman pull ghcr.io/${OWNER}/lambda_cpp26-small-deps:${{ steps.hash.outputs.tag }}; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache hit — skipping small-deps rebuild"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
            echo "Cache miss — will build transitives (~20 min)"
          fi

      - name: Build + push small-deps
        if: steps.check.outputs.cache_hit != 'true'
        run: |
          podman build -f Containerfile.small-deps \
            --build-arg REGISTRY_OWNER=${OWNER} \
            --build-arg GCC_TAG=${{ needs.gcc-base.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-small-deps:${{ steps.hash.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-small-deps:latest \
            .
          podman push ghcr.io/${OWNER}/lambda_cpp26-small-deps:${{ steps.hash.outputs.tag }}
          podman push ghcr.io/${OWNER}/lambda_cpp26-small-deps:latest
          echo "::notice::Built small-deps ${{ steps.hash.outputs.tag }}"

  arrow:
    name: Arrow deps (parallel)
    needs: small-deps
    runs-on: ubuntu-latest
    # Cold build: ~30 min (arrow compile only; transitives cached from small-deps).
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
      cache_hit: ${{ steps.check.outputs.cache_hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet                       \
                      /usr/local/lib/android                  \
                      /opt/ghc                                \
                      /opt/hostedtoolcache/CodeQL             \
                      /usr/local/.ghcup                       \
                      /usr/local/share/boost                  \
                      /opt/swift                              \
                      /usr/local/julia*                       \
                      /usr/lib/firefox                        \
                      /opt/microsoft/powershell               \
                      /usr/share/swift                        2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Hash inputs (arrow recipe + arrow-conanfile.py + profile + small-deps tag)
        id: hash
        run: |
          CONTENT_HASH=$(cat recipes/arrow/conanfile.py recipes/arrow/conandata.yml \
                              arrow-conanfile.py profiles/al2023 \
                        | sha256sum | awk '{print substr($1,1,16)}')
          HASH="${CONTENT_HASH}-${{ needs.small-deps.outputs.tag }}"
          echo "tag=$HASH" >> "$GITHUB_OUTPUT"
          echo "Arrow tag: $HASH"

      - name: Check cache hit
        id: check
        run: |
          if podman pull ghcr.io/${OWNER}/lambda_cpp26-arrow:${{ steps.hash.outputs.tag }}; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache hit — skipping arrow rebuild"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
            echo "Cache miss — will build arrow (~30 min)"
          fi

      - name: Build + push arrow
        if: steps.check.outputs.cache_hit != 'true'
        run: |
          podman build -f Containerfile.arrow \
            --build-arg REGISTRY_OWNER=${OWNER} \
            --build-arg SMALL_DEPS_TAG=${{ needs.small-deps.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-arrow:${{ steps.hash.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-arrow:latest \
            .
          podman push ghcr.io/${OWNER}/lambda_cpp26-arrow:${{ steps.hash.outputs.tag }}
          podman push ghcr.io/${OWNER}/lambda_cpp26-arrow:latest
          echo "::notice::Built arrow ${{ steps.hash.outputs.tag }}"

  quantlib:
    name: QuantLib deps (parallel)
    needs: small-deps
    runs-on: ubuntu-latest
    # Cold build: ~30 min (quantlib compile only; transitives cached).
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
      cache_hit: ${{ steps.check.outputs.cache_hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet                       \
                      /usr/local/lib/android                  \
                      /opt/ghc                                \
                      /opt/hostedtoolcache/CodeQL             \
                      /usr/local/.ghcup                       \
                      /usr/local/share/boost                  \
                      /opt/swift                              \
                      /usr/local/julia*                       \
                      /usr/lib/firefox                        \
                      /opt/microsoft/powershell               \
                      /usr/share/swift                        2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Hash inputs (quantlib recipe + quantlib-conanfile.py + profile + small-deps tag)
        id: hash
        run: |
          CONTENT_HASH=$(cat recipes/quantlib/conanfile.py recipes/quantlib/conandata.yml \
                              quantlib-conanfile.py profiles/al2023 \
                        | sha256sum | awk '{print substr($1,1,16)}')
          HASH="${CONTENT_HASH}-${{ needs.small-deps.outputs.tag }}"
          echo "tag=$HASH" >> "$GITHUB_OUTPUT"
          echo "QuantLib tag: $HASH"

      - name: Check cache hit
        id: check
        run: |
          if podman pull ghcr.io/${OWNER}/lambda_cpp26-quantlib:${{ steps.hash.outputs.tag }}; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache hit — skipping quantlib rebuild"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
            echo "Cache miss — will build quantlib (~30 min)"
          fi

      - name: Build + push quantlib
        if: steps.check.outputs.cache_hit != 'true'
        run: |
          podman build -f Containerfile.quantlib \
            --build-arg REGISTRY_OWNER=${OWNER} \
            --build-arg SMALL_DEPS_TAG=${{ needs.small-deps.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-quantlib:${{ steps.hash.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-quantlib:latest \
            .
          podman push ghcr.io/${OWNER}/lambda_cpp26-quantlib:${{ steps.hash.outputs.tag }}
          podman push ghcr.io/${OWNER}/lambda_cpp26-quantlib:latest
          echo "::notice::Built quantlib ${{ steps.hash.outputs.tag }}"

  assemble-devcontainer:
    name: Assemble devcontainer
    needs: [gcc-base, small-deps, arrow, quantlib]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build assembled devcontainer
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DATE_TAG="dev-$(date -u +%Y%m%d)"

          podman build -f .devcontainer/Dockerfile \
            --build-arg REGISTRY_OWNER=${OWNER} \
            --build-arg SMALL_DEPS_TAG=${{ needs.small-deps.outputs.tag }} \
            --build-arg ARROW_TAG=${{ needs.arrow.outputs.tag }} \
            --build-arg QUANTLIB_TAG=${{ needs.quantlib.outputs.tag }} \
            -t ghcr.io/${OWNER}/lambda_cpp26-dev:${SHORT_SHA} \
            -t ghcr.io/${OWNER}/lambda_cpp26-dev:latest \
            -t ghcr.io/${OWNER}/lambda_cpp26-dev:${DATE_TAG} \
            .

      - name: Push all tags
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DATE_TAG="dev-$(date -u +%Y%m%d)"
          podman push ghcr.io/${OWNER}/lambda_cpp26-dev:${SHORT_SHA}
          podman push ghcr.io/${OWNER}/lambda_cpp26-dev:latest
          podman push ghcr.io/${OWNER}/lambda_cpp26-dev:${DATE_TAG}

      - name: Summary
        if: always()
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DATE_TAG="dev-$(date -u +%Y%m%d)"
          {
            echo "### DevContainer image published"
            echo ""
            echo "Build inputs:"
            echo "| Stage | Tag | Status |"
            echo "|---|---|---|"
            echo "| gcc-base | \`${{ needs.gcc-base.outputs.tag }}\` | ${{ needs.gcc-base.outputs.cache_hit == 'true' && '✓ cache hit' || '🔄 rebuilt' }} |"
            echo "| small-deps | \`${{ needs.small-deps.outputs.tag }}\` | ${{ needs.small-deps.outputs.cache_hit == 'true' && '✓ cache hit' || '🔄 rebuilt' }} |"
            echo "| arrow | \`${{ needs.arrow.outputs.tag }}\` | ${{ needs.arrow.outputs.tag == 'skipped' && '⏭️ skipped (upstream cache hit)' || (${{ needs.arrow.outputs.cache_hit == 'true' }} && '✓ cache hit' || '🔄 rebuilt') }} |"
            echo "| quantlib | \`${{ needs.quantlib.outputs.tag }}\` | ${{ needs.quantlib.outputs.cache_hit == 'true' && '✓ cache hit' || '🔄 rebuilt' }} |"
            echo ""
            echo "Published tags:"
            echo '```'
            echo "ghcr.io/${OWNER}/lambda_cpp26-dev:${SHORT_SHA}"
            echo "ghcr.io/${OWNER}/lambda_cpp26-dev:latest"
            echo "ghcr.io/${OWNER}/lambda_cpp26-dev:${DATE_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
